services:
  # Backend API Service
  - type: web
    name: orbit-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ORBIT_CACHE_TTL_SECONDS
        value: 300
      - key: ORBIT_HTTP_TIMEOUT_SECONDS
        value: 10.0
      - key: GITHUB_TOKEN
        sync: false

  # Frontend Static Web Application
  - type: web
    name: orbit-app
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: orbit-api
          property: host
